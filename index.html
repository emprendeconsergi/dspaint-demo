/* DSPAINT visual identity */
:root{color:#161616;background:#F7F4F1}
body{background:#F7F4F1;color:#161616}
.sidebar{background:#F1CED0;color:#343434;border-right:1px solid #e5bdc0;padding:27px 16px}

.nav button.active,.nav button.active:hover{background:#161616;color:#fff;transform:none}
.sidebar-bottom{border-color:#d9b5b8;color:#4b4142}

.content{background:#F7F4F1}
.page-heading h1{color:#161616}.page-heading p,.muted{color:#615e5c}

.table-scroll td{border-color:#efebe8}.table-scroll tbody tr.clickable:hover{background:#fff8f8}
.line,.list-row,.quote-line{border-color:#ece8e5}
.line b,td strong,.list-row b{color:#161616}

<body><div class="app"><aside class="sidebar"><div class="brand"><img src="dspaint-logo.png" alt="DSPAINT"><small>Centro de operaciones</small></div><div class="side-label">Espacio de trabajo</div><nav id="nav" class="nav"></nav><div class="sidebar-art" role="img" aria-label="Referencia artística de DSPAINT"></div><div class="sidebar-bottom"><strong>Demo interactiva</strong><br>Datos y acciones simulados para la presentación. No hay conexión real con correo, WhatsApp ni ClassicGes.</div></aside><div class="main"><header class="topbar"><div class="crumb"><img class="mobile-logo" src="dspaint-logo.png" alt="DSPAINT"><span class="desktop-crumb">DSPAINT <span style="padding:0 7px">/</span> <strong id="crumb">Resumen</strong></span></div><div class="topright"><button class="btn primary new-project" onclick="newProject()">＋ Nuevo proyecto</button><button id="tour-button" class="tour-toggle" onclick="toggleGuide()">Iniciar recorrido</button><span class="demo-tag">DEMO · DATOS FICTICIOS</span><span class="avatar">DP</span></div></header><nav id="mobile-nav" class="mobile-nav"></nav><main id="content" class="content"></main></div></div><dialog id="project-dialog"><form onsubmit="addProject(event)"><div class="card-title"><h2>Nuevo proyecto de ejemplo</h2><button type="button" class="btn ghost tiny" onclick="this.closest('dialog').close()" aria-label="Cerrar">✕</button></div><div class="field"><label for="projectname">Nombre del proyecto</label><input id="projectname" name="projectname" required maxlength="100"></div><div class="field"><label for="owner">Cliente</label><input id="owner" name="owner" required maxlength="80"></div><p class="sub">Se añade a esta sesión de demostración.</p><button class="btn primary" type="submit">Crear proyecto de ejemplo</button></form></dialog><div id="toast" class="toast hide" role="status"></div>
<script>
const icons={Resumen:'▦',Clientes:'♙',Presupuestos:'▤',Precios:'◈',Documentos:'▣',Comunicaciones:'◌',Prospección:'◎'};
const pages=Object.keys(icons), initialLines=[{name:'Preparación y lijado',value:240},{name:'Pintura',value:560},{name:'Consumibles y disolvente · 500 g',value:57},{name:'Mano de obra · ejecución',value:420}];
let page='Clientes',selected='carlos',channel='WhatsApp',guide=false,guideStep=0,toastTimer;
const data={clients:[{id:'carlos',name:'Carlos Moreno',project:'Pintura completa · Local comercial',status:'Solicitud',amount:1277,contact:'Hoy',next:'Preparar borrador',email:'carlos@ejemplo.com',request:'Preparación, lijado y pintura de local comercial. Incluye consumibles y ejecución.',docs:false,signature:false,invoice:false,invoicePayload:false,activity:[['Solicitud recibida','La petición queda asociada a este proyecto · hoy']]},{id:'marta',name:'Marta Ríos',project:'Pintura de fachada',status:'Aceptado',amount:2480,contact:'Hoy',next:'Revisar acuerdo y solicitar firma',email:'marta@ejemplo.com',request:'Pintura exterior de fachada con reparación previa de desperfectos.',docs:true,signature:false,invoice:false,invoicePayload:false,activity:[['Acuerdo preparado','Borrador pendiente de revisión · hoy'],['Presupuesto aceptado','2.480 € · ayer']]},{id:'taller',name:'Taller Nord',project:'Acabado de piezas',status:'Cerrado',amount:860,contact:'Hace 12 días',next:'Proyecto cerrado',email:'taller@ejemplo.com',request:'Acabado y pintura de piezas.',docs:true,signature:true,invoice:true,invoicePayload:true,activity:[['Proyecto cerrado','Factura emitida · hace 12 días']]},{id:'laura',name:'Laura Vidal',project:'Restauración de mobiliario',status:'Borrador',amount:940,contact:'Ayer',next:'Validar presupuesto',email:'laura@ejemplo.com',request:'Restauración, preparación y pintura de mobiliario.',docs:false,signature:false,invoice:false,invoicePayload:false,activity:[['Borrador preparado','Pendiente de revisión · ayer']]}],lines:initialLines.map(x=>({...x})),priceApproved:false,followupDue:false,followupSent:false,prospectPrepared:false};
const euro=n=>new Intl.NumberFormat('es-ES',{style:'currency',currency:'EUR',minimumFractionDigits:0,maximumFractionDigits:2}).format(n),client=()=>data.clients.find(c=>c.id===selected)||data.clients[0],carlos=()=>data.clients[0],total=()=>data.lines.reduce((sum,l)=>sum+l.value,0),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const badge=(label,type)=>`<span class="pill ${type}"><span class="dot"></span>${label}</span>`,status=s=>badge(s,({Solicitud:'blue',Borrador:'gray',Enviado:'blue',Seguimiento:'orange',Aceptado:'green',Cerrado:'green'})[s]||'gray');
function navigate(p){page=p;render();window.scrollTo({top:0,behavior:'smooth'})}function choose(id,p='Clientes'){selected=id;if(p==='Clientes'){page='Ficha';render();window.scrollTo({top:0})}else navigate(p)}function notify(s){const t=document.getElementById('toast');t.textContent=s;t.classList.remove('hide');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.add('hide'),3300)}function log(c,title,detail){c.activity.unshift([title,detail])}
function heading(k,title,sub,action=''){return `<div class="page-heading"><div><div class="eyebrow">${k}</div><h1>${title}</h1><p>${sub}</p></div>${action}</div>`}function card(title,body,extra='',cls=''){return `<section class="card ${cls}"><div class="card-title"><h2>${title}</h2>${extra}</div>${body}</section>`}
function navRender(){for(const target of ['nav','mobile-nav'])document.getElementById(target).innerHTML=pages.map(p=>`<button class="${page===p?'active':''}" onclick="navigate('${p}')">${target==='nav'?`<span style="font-size:1.12rem;width:18px;text-align:center">${icons[p]}</span>`:''}${p}</button>`).join('');document.getElementById('crumb').textContent=page;document.getElementById('tour-button').textContent=guide?'Salir del recorrido':'Iniciar recorrido'}
const guideItems=[['01 · Solicitud','Carlos solicita un trabajo de pintura. Abre su ficha y comprueba que petición y proyecto están juntos.','Ver ficha',"choose('carlos','Clientes')"],['02 · Presupuesto','Prepara el borrador a partir de los trabajos y costes de ejemplo.','Abrir presupuesto',"navigate('Presupuestos')"],['03 · Revisión humana','Edita una partida si quieres. El total se recalcula; después marca el presupuesto como enviado.','Revisar borrador',"navigate('Presupuestos')"],['04 · Sin respuesta','Simula que pasan cinco días sin respuesta para mostrar la alerta de seguimiento.','Ver comunicaciones',"choose('carlos','Comunicaciones')"],['05 · Seguimiento','Revisa el mensaje propuesto y registra el seguimiento. Ningún mensaje real se envía.','Ver mensaje',"choose('carlos','Comunicaciones')"],['06 · Aceptación','Marca el presupuesto como aceptado. El proyecto y el archivo se actualizan juntos.','Abrir documentos',"choose('carlos','Documentos')"],['07 · Archivo y control','Muestra los borradores preparados y vuelve al resumen. El cambio de precio se valida por separado.','Volver al resumen',"navigate('Resumen')"]];
function tour(){if(!guide)return '';let g=guideItems[Math.min(guideStep,6)];return `<div class="tour"><div class="tour-progress">RECORRIDO GUIADO · PASO ${Math.min(guideStep+1,7)} DE 7</div><div class="tour-row"><div><strong>${g[0]}</strong><p>${g[1]}</p></div><button class="btn secondary" onclick="${g[3]}">${g[2]}</button></div><div class="tour-track"><span style="width:${Math.max(8,(guideStep+1)/7*100)}%"></span></div></div>`}function toggleGuide(){guide=!guide;if(guide){guideStep=0;selected='carlos';page='Resumen'}render()}
function tableRows(){return data.clients.map(c=>`<tr class="clickable" onclick="choose('${c.id}')"><td><strong>${c.name}</strong><small>${c.project}</small></td><td>${status(c.status)}</td><td>${c.docs?badge('Borradores preparados','green'):badge('Pendiente','orange')}</td><td>${c.signature?badge('Firmado','green'):c.status==='Aceptado'?badge('Pendiente','orange'):'—'}</td><td>${c.invoice?badge('Emitida','green'):'—'}</td><td><strong>${euro(c.amount)}</strong></td></tr>`).join('')}
function attention(){let a=[];const c=carlos();if(c.status==='Solicitud')a.push({ico:'▤',type:'orange',title:'Solicitud por presupuestar',desc:'Carlos Moreno · pintura de local comercial',action:"navigate('Presupuestos')",text:'Preparar borrador'});if(c.status==='Borrador')a.push({ico:'✎',type:'orange',title:'Presupuesto por revisar',desc:`Carlos Moreno · ${euro(c.amount)}`,action:"navigate('Presupuestos')",text:'Revisar y enviar'});if(data.followupDue)a.push({ico:'↗',type:'orange',title:'Seguimiento pendiente',desc:'Carlos Moreno · sin respuesta desde hace 5 días',action:"choose('carlos','Comunicaciones')",text:'Preparar seguimiento'});if(!data.priceApproved)a.push({ico:'!',type:'red',title:'Precio por validar',desc:'Pintura industrial · factura con coste distinto',action:"navigate('Precios')",text:'Revisar coste'});if(!data.clients[1].signature)a.push({ico:'✎',type:'orange',title:'Firma pendiente',desc:'Marta Ríos · acuerdo preparado',action:"choose('marta','Documentos')",text:'Ver proyecto'});if(c.docs&&!c.signature)a.push({ico:'✎',type:'orange',title:'Acuerdo por revisar',desc:'Carlos Moreno · borrador preparado',action:"choose('carlos','Documentos')",text:'Ver documentos'});return `<div class="attention">${a.map(x=>`<div class="attention-item"><span class="icon ${x.type}">${x.ico}</span><div><b>${x.title}</b><p>${x.desc}</p><button onclick="${x.action}">${x.text}</button></div></div>`).join('')}</div>`}
function dashboard(){let pending=data.clients.filter(c=>['Borrador','Enviado','Seguimiento'].includes(c.status)).length;let needs=(['Solicitud','Borrador'].includes(carlos().status)?1:0)+(data.followupDue?1:0)+(data.priceApproved?0:1)+(data.clients[1].signature?0:1)+(carlos().docs&&!carlos().signature?1:0);return heading('Vista general','Tu negocio, de un vistazo','Clientes, presupuestos y acciones que requieren tu atención.',`<button class="btn primary" onclick="toggleGuide()">${guide?'Ocultar recorrido':'Mostrar recorrido de ejemplo'}</button>`)+`<div class="stats"><div class="stat"><div class="stat-label">Proyectos activos</div><div class="stat-value">${data.clients.filter(c=>c.status!=='Cerrado').length}</div><div class="stat-foot">En distintas fases</div></div><div class="stat"><div class="stat-label">Presupuestos abiertos</div><div class="stat-value">${pending}</div><div class="stat-foot">Borrador, enviado o seguimiento</div></div><div class="stat"><div class="stat-label">Requieren atención</div><div class="stat-value">${needs}</div><div class="stat-foot">Revisión o acción pendiente</div></div><div class="stat"><div class="stat-label">Importe en curso</div><div class="stat-value">${euro(data.clients.filter(c=>c.status!=='Cerrado').reduce((a,c)=>a+c.amount,0))}</div><div class="stat-foot">Importes de ejemplo</div></div></div><div class="grid-main">${card('Proyectos',`<div class="table-scroll"><table><thead><tr><th>Cliente / proyecto</th><th>Presupuesto</th><th>Docs.</th><th>Firma</th><th>Factura</th><th>Importe</th></tr></thead><tbody>${tableRows()}</tbody></table></div>`,`<span class="sub">Abre una fila</span>`)}${card('Requiere atención',attention())}${card('Cómo avanza un trabajo',`<div class="flow"><div class="flow-step"><div class="num">01</div><b>Solicitud</b><span>En su ficha de cliente</span></div><div class="flow-step"><div class="num">02</div><b>Borrador</b><span>Costes y revisión</span></div><div class="flow-step"><div class="num">03</div><b>Envío</b><span>Tras tu validación</span></div><div class="flow-step"><div class="num">04</div><b>Seguimiento</b><span>Alerta sin respuesta</span></div><div class="flow-step"><div class="num">05</div><b>Aceptación</b><span>Documentos preparados</span></div></div>`,'','wide')}</div>`}
function legacyClients(){let c=client();return heading('Fichas de cliente','Cada proyecto, con su contexto','Información y siguiente paso sin buscar en varias herramientas.')+`<div class="grid-main">${card('Clientes y proyectos',`<div class="stack">${data.clients.map(v=>`<button class="list-row client-select" style="background:${v.id===selected?'#f3f7fa':'transparent'};border-left:${v.id===selected?'3px solid #e97b2c':'3px solid transparent'}" onclick="choose('${v.id}')"><span><b>${v.name}</b><small>${v.project}</small></span>${status(v.status)}</button>`).join('')}</div>`)}${card(`Ficha · ${c.name}`,`<div class="line"><span>Proyecto</span><b>${c.project}</b></div><div class="line"><span>Presupuesto</span><b>${euro(c.amount)} · ${c.status}</b></div><div class="line"><span>Último contacto</span><b>${c.contact}</b></div><div class="line"><span>Documentos</span>${c.docs?badge('Borradores preparados','green'):badge('Pendientes','orange')}</div><div class="line"><span>Firma</span>${c.signature?badge('Firmado','green'):badge(c.status==='Aceptado'?'Pendiente':'No iniciada',c.status==='Aceptado'?'orange':'gray')}</div><hr class="divider"><b style="font-size:.83rem">Petición inicial</b><p class="muted" style="font-size:.84rem">${c.request}</p><div class="callout orange"><b>Siguiente acción:</b> ${c.next}</div><div class="button-row"><button class="btn secondary" onclick="navigate('Presupuestos')">Ver presupuestos</button><button class="btn ghost" onclick="navigate('Documentos')">Ver archivo</button></div>`)}${card('Actividad del proyecto',`<div class="timeline">${c.activity.map(x=>`<div class="event"><b>${esc(x[0])}</b><p>${esc(x[1])}</p></div>`).join('')}</div>`,'','wide')}</div>`}
function quoteActions(){let c=carlos();if(c.status==='Solicitud')return `<button class="btn primary" onclick="generateQuote()">Preparar borrador</button>`;if(c.status==='Borrador')return `<button class="btn primary" onclick="sendQuote()">Marcar como enviado</button>`;return `<span>${status(c.status)}</span><button class="btn ghost" onclick="choose('carlos','Clientes')">Ver ficha</button>`}

function communications(){let c=client(),isCarlos=c.id==='carlos';let example=c.status==='Aceptado'?`Hola ${c.name.split(' ')[0]}, gracias por confirmar el presupuesto. Tenemos el borrador del acuerdo preparado para revisarlo contigo antes de solicitar la firma.`:c.status==='Cerrado'?`Hola ${c.name.split(' ')[0]}, el proyecto ya está cerrado. Si necesitas cualquier aclaración sobre la documentación, estamos disponibles.`:isCarlos?`Hola Carlos, te escribimos para saber si has podido revisar el presupuesto de pintura del local. Si tienes alguna duda, lo vemos contigo.`:`Hola ${c.name.split(' ')[0]}, te escribimos sobre tu proyecto de ${c.project.toLowerCase()}. ¿Hay algo que quieras comentar?`;return heading('Seguimiento y mensajes','La conversación en su contexto','Una alerta propone la acción; tú decides cómo continuar.')+`<div class="two">${card('Conversación · '+c.name,`<div class="tabs"><button class="${channel==='WhatsApp'?'active':''}" onclick="setChannel('WhatsApp')">WhatsApp</button><button class="${channel==='Email'?'active':''}" onclick="setChannel('Email')">Email</button></div><div class="chat">${isCarlos?`<div class="bubble">Hola, necesito presupuesto para preparar y pintar un local. ¿Podéis revisarlo?<small>Solicitud ficticia · ${channel}</small></div>`:''}${isCarlos&&c.status!=='Solicitud'&&c.status!=='Borrador'?`<div class="bubble out">Te compartimos el presupuesto de ${euro(c.amount)} para el local. Quedamos pendientes de tu revisión.<small>Envío simulado · no real</small></div>`:''}${data.followupSent&&isCarlos?`<div class="bubble out">${example}<small>Seguimiento registrado · no enviado</small></div>`:''}<div class="bubble out">${channel==='Email'?`Asunto: ${c.status==='Aceptado'?'Documentación de tu proyecto':'Seguimiento de tu proyecto'}<br><br>`:''}${example}<small>Borrador propuesto · sin enviar</small></div></div><div class="callout orange" style="margin-top:14px">Esta conversación es ficticia. No hay conexión con correo ni con la API de WhatsApp.</div>`)}${card('Siguiente acción',`<div class="field"><label for="comclient">Proyecto</label><select id="comclient" onchange="selectClient(this.value)">${data.clients.map(x=>`<option value="${x.id}" ${x.id===selected?'selected':''}>${x.name} · ${x.project}</option>`).join('')}</select></div><div class="line"><span>Último contacto</span><b>${c.contact}</b></div><div class="line"><span>Estado</span>${status(c.status)}</div><div class="line"><span>Siguiente paso</span><b>${c.next}</b></div><hr class="divider"><b style="font-size:.84rem">Propuesta para revisar</b><p class="muted" style="font-size:.84rem">${example}</p><div class="button-row">${isCarlos&&c.status==='Enviado'&&!data.followupDue&&!data.followupSent?`<button class="btn primary" onclick="simulateWait()">Simular 5 días sin respuesta</button>`:''}${isCarlos&&data.followupDue?`<button class="btn primary" onclick="markFollowup()">Registrar seguimiento</button>`:''}${isCarlos&&['Enviado','Seguimiento'].includes(c.status)?`<button class="btn ghost" onclick="choose('carlos','Documentos')">Ver aceptación</button>`:''}</div><p class="sub">Registrar una acción modifica el panel; nunca envía un mensaje real.</p>`)}${card('Excepción humana',`<div class="callout orange"><b>Si falta información, se deriva a una persona.</b> Una consulta sensible o sin respuesta fiable genera una alerta. Las reglas y posibilidades de WhatsApp dependen de la API y configuración disponibles.</div>`,'','wide')}</div>`}

function selectClient(id){selected=id;render()}function updateLine(i,raw){let v=Number(raw);if(!Number.isFinite(v)||v<0)v=0;data.lines[i].value=Math.round(v*100)/100;carlos().amount=total();const el=document.getElementById('quote-total');if(el)el.textContent=euro(total())}
function generateQuote(){let c=carlos();if(c.status!=='Solicitud')return;c.status='Borrador';c.next='Revisar partidas y marcar como enviado';log(c,'Borrador preparado',`${euro(c.amount)} · pendiente de revisión · hoy`);guideStep=Math.max(guideStep,2);render();notify('Borrador preparado; revisa las partidas')}
function sendQuote(){let c=carlos();if(c.status!=='Borrador')return;c.amount=total();c.status='Enviado';c.contact='Hoy';c.next='Esperar respuesta del cliente';log(c,'Presupuesto enviado · simulación',`${euro(c.amount)} · hoy`);guideStep=Math.max(guideStep,3);render();notify('Estado actualizado: enviado en la demo')}
function simulateWait(){let c=carlos();if(c.status!=='Enviado'||data.followupSent)return;data.followupDue=true;c.contact='Hace 5 días';c.next='Revisar y registrar seguimiento';log(c,'Seguimiento pendiente','Sin respuesta durante 5 días simulados');guideStep=Math.max(guideStep,4);render();notify('Alerta de seguimiento visible en el resumen')}
function markFollowup(){let c=carlos();if(!data.followupDue)return;data.followupDue=false;data.followupSent=true;c.status='Seguimiento';c.contact='Hoy';c.next='Esperar respuesta o confirmar aceptación';log(c,'Seguimiento registrado · simulación','Mensaje revisado; no se ha enviado nada');guideStep=Math.max(guideStep,5);render();notify('Seguimiento registrado, sin envío real')}
function acceptQuote(){let c=client();if(!['Enviado','Seguimiento'].includes(c.status))return;c.status='Aceptado';c.docs=true;c.next='Revisar acuerdo y solicitar firma';if(c.id==='carlos')data.followupDue=false;log(c,'Presupuesto aceptado · simulación',`Acuerdo y concepto de factura preparados como borradores · ${euro(c.amount)}`);guideStep=Math.max(guideStep,6);render();notify('Aceptado: borradores preparados en su proyecto')}
function markSigned(){let c=client();if(c.status!=='Aceptado'||c.signature)return;c.signature=true;c.next='Revisar facturación';log(c,'Firma recibida · simulación','Acuerdo marcado como firmado');render();notify('Firma marcada como recibida en la demo')}
function prepareClassic(){let c=client();if(!c.docs||c.invoicePayload)return;c.invoicePayload=true;log(c,'Datos de factura preparados · simulación','Pendientes de revisar; ClassicGes no está conectado');render();notify('Datos preparados, sin factura ni conexión real')}
function approvePrice(){if(data.priceApproved)return;data.priceApproved=true;render();notify('Coste validado para futuros presupuestos')}
function setChannel(v){channel=v;render()}function prepareProspect(){data.prospectPrepared=true;render();notify('Borrador preparado, sin enviar')}function resetDemo(){location.reload()}
function registerDemoTools(){const ctx=document.modelContext;if(!ctx?.registerTool)return;try{Promise.resolve(ctx.registerTool({name:'inspect_demo_panel',title:'Consultar demo DSPAINT',description:'Consulta proyectos ficticios y estados de esta demostración.',inputSchema:{type:'object',properties:{},additionalProperties:false},annotations:{readOnlyHint:true},execute(){return {projects:data.clients.map(c=>({client:c.name,status:c.status,amount:c.amount,next:c.next})),priceValidated:data.priceApproved}}})).catch(()=>{})}catch(e){}}

function designList(){let filtered=designProjects.filter(p=>(designCategory==='Todos'||p.category===designCategory)&&`${p.name} ${p.owner} ${p.tags.join(' ')}`.toLocaleLowerCase().includes(designQuery.toLocaleLowerCase()));return filtered.length?filtered.map(p=>`<button class="project-row ${p.id===designSelected?'selected':''}" onclick="setProject('${p.id}')">${photo(p.thumb,'project-thumb')}<div class="project-row-content"><div class="project-category">${p.category}</div><strong>${esc(p.name)}</strong><span class="project-owner">♙ ${esc(p.owner)}</span><div class="project-meta"><span>⌖ ${p.place}</span><span>▦ Inicio: ${p.start}</span><span>▦ Entrega: ${p.end}</span></div><div class="project-tags">${p.tags.map(t=>`<span>${t}</span>`).join('')}</div></div><div class="project-row-state">${designState(p)}<span class="open-chevron">›</span><span class="assignee">DP</span></div></button>`).join(''):`<div class="empty" style="padding:35px">No hay proyectos con esos filtros. Prueba otra búsqueda o selecciona Todos.</div>`}
function renderDesignList(){const el=document.getElementById('project-list');if(el)el.innerHTML=designList()}
function designDetail(){let p=designGet();let content='';if(designTab==='Resumen')content=`<div class="project-details-grid"><div><small>Ubicación</small>${p.place}</div><div><small>Tipo de proyecto</small>${p.category}</div><div><small>Fecha de inicio</small>${p.start}</div><div><small>Materiales</small>${p.materials}</div><div><small>Fecha de entrega</small>${p.end}</div><div><small>Medidas</small>${p.size}</div></div><div class="detail-description"><b>Descripción</b><p>${p.description}</p><b>Etiquetas</b><div class="project-tags">${p.tags.map(t=>`<span>${t}</span>`).join('')}</div></div>`;
if(designTab==='Documentos')content=`<div class="list-row"><span><b>Referencias visuales</b><small>Imágenes ilustrativas de la demo</small></span>${badge('Disponible','green')}</div><div class="list-row"><span><b>Ficha del proyecto</b><small>Cliente, materiales y plazos</small></span>${badge('Preparada','green')}</div><div class="list-row"><span><b>Acuerdo de colaboración</b><small>Borrador de ejemplo</small></span>${badge(p.id==='carlos'&&!carlos().docs?'Pendiente':'Preparado',p.id==='carlos'&&!carlos().docs?'orange':'green')}</div>${p.id==='carlos'?`<button class="btn secondary" onclick="choose('carlos','Documentos')">Abrir archivo del caso</button>`:''}`;
if(designTab==='Presupuesto')content=`<div class="total"><span>Importe del ejemplo</span><strong>${euro(p.id==='carlos'?carlos().amount:p.amount)}</strong></div><p class="muted">${p.id==='carlos'?'Puedes editar las partidas y seguir el proceso de aprobación.':'Referencia ficticia para la presentación. El caso de Carlos permite editar el cálculo completo.'}</p><button class="btn primary" onclick="choose('carlos','Presupuestos')">Abrir presupuesto interactivo</button>`;
if(designTab==='Comunicación')content=`<div class="chat"><div class="bubble">Hola, ¿podéis actualizarme sobre el estado del proyecto?<small>Cliente · mensaje ficticio</small></div><div class="bubble out">Lo tenemos registrado. Revisaremos los detalles contigo antes de confirmar el siguiente paso.<small>Borrador propuesto · simulación</small></div></div><div class="button-row"><button class="btn secondary" onclick="choose('carlos','Comunicaciones')">Ver seguimiento interactivo</button></div>`;
if(designTab==='Producción')content=`<div class="line"><span>Estado</span>${designState(p)}</div><div class="line"><span>Materiales</span><b>${p.materials}</b></div><div class="line"><span>Entrega prevista</span><b>${p.end}</b></div><p class="muted">Planificación ilustrativa. Fechas y materiales se confirmarían con DSPAINT.</p>`;
return `<div class="project-detail">${photo(p.crop,'project-cover')}<div class="project-gallery">${[p,...designProjects.filter(x=>x.id!==p.id).slice(0,3)].map(x=>`<button onclick="setProject('${x.id}')" aria-label="Ver ${esc(x.name)}" class="${x.id===p.id?'selected':''}">${photo(x.thumb)}</button>`).join('')}<span class="gallery-label">Ejemplos</span></div><div class="project-detail-body"><div class="project-category">${p.category}</div><div class="detail-heading"><h2>${esc(p.name)}</h2>${designState(p)}</div><div class="project-owner">♙ ${esc(p.owner)}</div><div class="detail-tabs">${['Resumen','Documentos','Presupuesto','Comunicación','Producción'].map(t=>`<button class="${designTab===t?'active':''}" onclick="setDesignTab('${t}')">${t}</button>`).join('')}</div><div class="detail-tab-content">${content}</div></div></div>`}
function clients(){return `<section class="design-hero"><div class="hero-copy"><div class="eyebrow">CLIENTES Y PROYECTOS</div><h1>Cada proyecto,<br>con todo su <em>contexto</em></h1><p>Información, imágenes, materiales, presupuestos y comunicaciones en un solo lugar.</p></div><div class="hero-art" aria-hidden="true"></div></section><div class="project-toolbar"><div class="category-tabs">${['Todos','Arte personalizado','Nitrato de plata','Intervenciones visuales','Pintura y modelado','Cine y escenografía'].map(t=>`<button onclick="setCategory('${t}')" class="${designCategory===t?'active':''}">${t}</button>`).join('')}</div><input aria-label="Buscar proyectos" class="project-search" placeholder="Buscar proyectos…" value="${esc(designQuery)}" oninput="filterProjects(this.value)"></div><div class="design-columns"><section id="project-list" class="project-list">${designList()}</section>${designDetail()}</div>`}
function newProject(){document.getElementById('project-dialog').showModal()}
function addProject(event){event.preventDefault();const form=event.target;let name=form.elements.projectname.value.trim(),owner=form.elements.owner.value.trim();if(!name||!owner)return;const id='demo-'+Date.now();designProjects.unshift({id,name,owner,category:'Arte personalizado',place:'Por confirmar',start:'Hoy',end:'Por confirmar',state:'Pendiente',color:'orange',tags:['Nuevo proyecto'],crop:designProjects[0].crop,thumb:designProjects[0].thumb,description:'Proyecto añadido durante la demostración. Datos y conexiones simulados.',materials:'Por definir',size:'Por definir',amount:0});designSelected=id;designQuery='';designCategory='Todos';document.getElementById('project-dialog').close();form.reset();page='Clientes';render();notify('Proyecto de ejemplo añadido a la demo')}

render();registerDemoTools();
</script></body></html>
